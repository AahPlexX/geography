name: Build and deploy Geography Study Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PNPM_VERSION: 12.14.0
  NODE_VERSION: 22.23.4

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}

      # shortcut: install is non-frozen until a canonical single-document pnpm 12 lockfile is committed; switch to --frozen-lockfile then.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v7.0.2
        with:
          name: generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  smoke:
    name: Verify public site
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify live HTML and critical assets
        shell: bash
        run: |
          set -euo pipefail
          site="https://aahplexx.github.io/geography/"
          html=""
          for attempt in {1..12}; do
            if html="$(curl --fail --silent --show-error --location --max-time 20 "$site")"; then
              break
            fi
            sleep 5
          done
          test -n "$html"
          grep -Fq '<title>Geography Study Lab</title>' <<<"$html"
          asset="$(grep -oE 'src="/geography/assets/[^"]+\.js"' <<<"$html" | head -n 1 | cut -d'"' -f2)"
          test -n "$asset"
          curl --fail --silent --show-error --location --max-time 30 "https://aahplexx.github.io${asset}" >/dev/null
          map_bytes="$(curl --fail --silent --show-error --location --max-time 30 "$site"'data/world-countries.geojson' | wc -c)"
          test "$map_bytes" -gt 100000
          echo "Verified live site, JavaScript bundle, and detailed world map asset (${map_bytes} bytes)."
